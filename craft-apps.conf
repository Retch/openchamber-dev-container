# ArtCraft suite apps to install into the image.
#
# Every entry is the app name; the newest release of each app is downloaded from
# its GitHub releases page and installed as an RPM. Each app provides an MCP
# server that is registered automatically for opencode.
#
# Available apps:
#   cadcraft
#   deckcraft
#   designcraft
#   effectcraft
#   figcraft
#   filmcraft
#   gridcraft
#   lightcraft
#   pdfcraft
#   photocraft
#   soundcraft
#   vectorcraft
#   wordcraft
#
# Separate entries with spaces. Leave empty to install none.
CRAFT_APPS=""
